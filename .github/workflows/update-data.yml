name: 경제 지표 데이터 갱신
on:
  schedule:
    - cron: "17 * * * *"    # 매시간(17분) 갱신
  workflow_dispatch: {}      # Actions 탭에서 '지금 실행' 가능
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 데이터 받기 + 화면 다시 만들기
        run: |
          python fetch_data.py data.json
          python build.py
      - name: 바뀐 게 있으면 저장
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "데이터 자동 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
