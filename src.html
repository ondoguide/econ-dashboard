<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경제 지표 대시보드</title>
<meta name="theme-color" content="#14213a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="경제지표">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#f0efea; --line:#e3e1da; --grid:#ebe9e3;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7d7b75; --accent:#14213a;
  --up:#c43a3a; --down:#2a62c4;
  --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100; --s4:#1a1a1a; --s5:#6250d6; --s6:#e34948; --s7:#e87ba4; --s8:#008300;
  --div-neg:#2a78d6; --div-pos:#e34948; --div-mid:#f0efec;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f; --grid:#2a2a27;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86; --accent:#e8e6df;
    --up:#ff7b7b; --down:#78a9ff;
    --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#e8e6df; --s5:#9085e9; --s6:#e66767; --s7:#d55181; --s8:#008300;
    --div-neg:#3987e5; --div-pos:#e66767; --div-mid:#383835;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --line:#33332f; --grid:#2a2a27;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86; --accent:#e8e6df;
  --up:#ff7b7b; --down:#78a9ff;
  --s1:#3987e5; --s2:#199e70; --s3:#c98500; --s4:#e8e6df; --s5:#9085e9; --s6:#e66767; --s7:#d55181; --s8:#008300;
  --div-neg:#3987e5; --div-pos:#e66767; --div-mid:#383835;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--text-2);margin-top:3px}
.hbtn{display:flex;gap:6px;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font-size:13px;color:var(--text-2)}
.ibtn:active{transform:scale(.97)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--text-3);margin-right:2px;min-width:34px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;font-size:13.5px;color:var(--text-2);min-height:36px;transition:background .15s,border-color .15s}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35;flex:none}
.chip .no{font-size:11px;font-weight:700;color:var(--text-3)}
.chip[aria-pressed="true"]{background:var(--surface-2);border-color:color-mix(in srgb,var(--c) 55%,var(--line));color:var(--text);font-weight:600}
.chip[aria-pressed="true"] .dot{opacity:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;font-size:13px;color:var(--text-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.pre{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:12.5px;color:var(--text-2);min-height:34px}
.pre.main{border-style:solid;border-color:var(--accent);color:var(--text);font-weight:600}
.controls{display:grid;gap:10px;margin-bottom:12px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.chart-title{font-weight:700;font-size:15px}
.chart-note{font-size:12px;color:var(--text-3)}
.cv-wrap{position:relative;width:100%}
canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:150px;z-index:5;display:none}
.tip .d{font-weight:700;margin-bottom:4px;color:var(--text)}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:1px 0;color:var(--text-2)}
.tip .r i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tip .r b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 0 8px;flex-wrap:wrap}
.tbar .seg button{padding:6px 11px;min-height:32px;font-size:12.5px}
.seg.iv button{min-width:42px;font-weight:600}
.spanrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--text-3);margin:2px 0 6px;font-variant-numeric:tabular-nums}
.spanrow .rst{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--text-2);visibility:hidden}
.spanrow .rst.on{visibility:visible}
canvas.main{cursor:crosshair;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas.main.grab{cursor:grabbing}
.navwrap{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
canvas.nav{touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.moves{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.moves>span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;background:var(--surface)}
.moves .up{color:var(--up)} .moves .down{color:var(--down)}
.moves i{width:8px;height:8px;border-radius:50%;display:inline-block}
.moves b{color:var(--text);font-weight:600}
.hint{font-size:11.5px;color:var(--text-3);margin-top:6px}
.spark{display:block;width:100%;height:34px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s2);margin-right:5px;vertical-align:1px}
.sbox{position:relative}
#sq{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);padding:0 12px;font:inherit;font-size:14px}
#sq:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:1px}
#sres{position:absolute;left:0;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.14);z-index:20;max-height:320px;overflow:auto}
#sres button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;text-align:left;font-size:14px}
#sres button:last-child{border-bottom:0} #sres button span{color:var(--text-3);font-size:12px;white-space:nowrap}
#finv .chip{padding:6px 12px}
#finv .chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
#fmode button{padding:4px 10px;min-height:28px;font-size:12px}
#ftable td{font-variant-numeric:tabular-nums} #ftable tr:hover td{background:var(--surface-2)}
#fhead b{color:var(--text)}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.mcard .t{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.mcard .t i{width:9px;height:9px;border-radius:50%}
.mcard .t small{font-weight:400;color:var(--text-3)}
h2{font-size:15px;margin:22px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text-2)}
.card .top b{color:var(--text);font-size:13.5px;display:flex;gap:6px;align-items:center}
.card .top b i{width:9px;height:9px;border-radius:50%}
.card .v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .v small{font-size:12px;font-weight:500;color:var(--text-3);margin-left:3px}
.deltas{display:flex;gap:12px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.pct{font-size:11.5px;color:var(--text-3)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);position:relative;margin-top:3px}
.bar u{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--text);text-decoration:none}
.note{font-size:12.3px;color:var(--text-2);line-height:1.5}
.ana{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}
@media (max-width:820px){.ana{grid-template-columns:1fr}}
.sum li{margin-bottom:6px;font-size:13.5px;line-height:1.55}
.sum{margin:0;padding-left:18px}
table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--text-3);font-weight:600}
.corr td{text-align:center;border:2px solid var(--surface);border-radius:4px;font-weight:600}
.corr th{text-align:center}
.scroll{overflow-x:auto}
.foot{margin-top:26px;font-size:11.5px;color:var(--text-3);line-height:1.7}
.empty{padding:40px 10px;text-align:center;color:var(--text-3);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:560px){
  .wrap{padding:12px 12px 32px} h1{font-size:18px} .card .v{font-size:20px}
  .lbl{display:none} .panel{padding:12px} .controls{gap:8px}
  .chip{padding:5px 10px 5px 8px;font-size:12.5px;min-height:32px;gap:5px}
  .pre{padding:5px 10px;font-size:12px;min-height:30px}
  .row.opts{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
  .row.opts::-webkit-scrollbar{display:none}
  .seg{flex:none} .seg button{padding:7px 10px;font-size:12.5px;min-height:32px}
  .chart-note{font-size:11.5px} .ibtn{height:34px;padding:0 9px}
  .tbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none} .tbar::-webkit-scrollbar{display:none}
  .tbar .seg button{padding:6px 9px;font-size:12px} .seg.iv button{min-width:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>경제 지표 대시보드</h1>
      <div class="sub" id="sub">불러오는 중</div>
    </div>
    <div class="hbtn">
      <button class="ibtn" id="refresh" title="데이터 새로고침" aria-label="데이터 새로고침">↻ 새로고침</button>
      <button class="ibtn" id="theme" title="밝게/어둡게" aria-label="화면 밝기 전환">☾</button>
    </div>
  </header>

  <section class="panel controls" aria-label="표시 설정">
    <div class="row"><span class="lbl">묶음</span>
      <button class="pre main" data-preset="core">기본 ①②③⑥</button>
      <button class="pre" data-preset="all">전체 켜기</button>
      <button class="pre" data-preset="none">전체 끄기</button>
    </div>
    <div class="row" id="chips"><span class="lbl">지표</span></div>
    <div class="row opts">
      <span class="lbl">보기</span>
      <div class="seg" id="mode">
        <button data-m="cmp" aria-pressed="true">겹쳐 비교</button><button data-m="multi">개별 차트</button>
      </div>
      <div class="seg" id="norm" title="겹쳐 비교 방식">
        <button data-n="mm" aria-pressed="true">상대 위치</button><button data-n="b100">기준=100</button>
      </div>
    </div>
  </section>

  <section class="panel" id="chartPanel">
    <div class="tbar">
      <div class="seg iv" id="iv" role="group" aria-label="봉 단위"><button data-iv="D">일</button><button data-iv="W">주</button><button data-iv="M">월</button></div>
      <div class="seg" id="range" role="group" aria-label="기간"><button data-r="1">1개월</button><button data-r="3">3개월</button><button data-r="6">6개월</button><button data-r="12">1년</button><button data-r="36">3년</button><button data-r="60">5년</button><button data-r="120">10년</button><button data-r="0">전체</button></div>
    </div>
    <div class="chart-head">
      <div class="chart-title" id="ctitle">겹쳐 비교</div>
      <div class="chart-note" id="cnote"></div>
    </div>
    <div class="spanrow"><span id="span"></span><button class="rst" id="reset">기간 처음으로</button></div>
    <div id="chartArea"></div>
    <div class="navwrap"><canvas class="nav" id="nav" aria-label="전체 기간 내비게이터"></canvas></div>
    <div class="hint" id="hint"></div>
    <div class="moves" id="moves"></div>
    <div class="legend" id="legend"></div>
  </section>

  <h2>지표별 현황</h2>
  <div class="cards" id="cards"></div>

  <h2>동향 분석 <span class="chart-note" style="font-weight:400">· 차트에서 보고 있는 구간 기준으로 바로 다시 계산됩니다</span></h2>
  <div class="ana">
    <section class="panel"><div class="chart-title" style="margin-bottom:8px">자동 요약 <span class="chart-note" id="sumnote"></span></div><ul class="sum" id="summary"></ul></section>
    <section class="panel"><div class="chart-title">함께 움직이는 정도 <span class="chart-note" id="corrnote"></span></div>
      <div class="chart-note" style="margin:4px 0 8px">+1에 가까우면 같은 방향, −1이면 반대 방향, 0 근처면 관계 약함</div>
      <div class="scroll" id="corr"></div></section>
  </div>

  <h2>수급 동향 <span class="chart-note" style="font-weight:400">· 외국인·기관 등 큰 자금의 매수·매도 흐름</span></h2>
  <section class="panel" id="flowPanel">
    <div class="tbar">
      <div class="seg" id="fsrc" role="group" aria-label="수급 대상"><button data-s="mkt">KOSPI 전체</button><button data-s="stk">종목</button></div>
      <div class="seg" id="frange" role="group" aria-label="수급 기간"><button data-r="1">1개월</button><button data-r="3">3개월</button><button data-r="6">6개월</button><button data-r="12">1년</button><button data-r="36">3년</button><button data-r="0">전체</button></div>
    </div>
    <div id="stkbar" hidden>
      <div class="sbox"><input id="sq" type="search" inputmode="search" placeholder="종목 이름이나 코드 검색 (예: 삼성전자, 005930)" autocomplete="off" aria-label="종목 검색"><div id="sres" hidden></div></div>
      <div class="row" id="srecent" style="margin-top:8px"></div>
    </div>
    <div class="row" id="finv" style="margin:10px 0 4px"></div>
    <div class="spanrow"><span id="fhead"></span><div class="seg" id="fmode" role="group" aria-label="표시 방식"><button data-m="day">일별</button><button data-m="cum">누적</button></div></div>
    <div id="fchart"></div>
    <div class="moves" id="fstreak"></div>
    <div class="scroll" id="ftable" style="margin-top:10px"></div>
  </section>

  <h2 style="display:flex;justify-content:space-between;align-items:center">표로 보기 <button class="ibtn" id="tblBtn" aria-expanded="false">펼치기</button></h2>
  <section class="panel scroll" id="tbl" hidden></section>

  <div class="foot" id="foot"></div>
</div>
<div class="toast" id="toast"></div>

<script id="seed" type="application/json">__SEED__</script>
<script>
(()=>{
const META={
 fedfunds:{no:1,c:'--s1',kind:'rate',short:'미 금리'},
 usdkrw:{no:2,c:'--s2',kind:'level',short:'환율'},
 gold:{no:3,c:'--s3',kind:'level',short:'금'},
 wti:{no:4,c:'--s4',kind:'level',short:'WTI'},
 ust10:{no:5,c:'--s5',kind:'rate',short:'미 10년물'},
 kospi:{no:6,c:'--s6',kind:'level',short:'KOSPI'},
 unrate:{no:7,c:'--s7',kind:'rate',short:'미 실업률'},
 krcli:{no:8,c:'--s8',kind:'level',short:'한국 선행'},
};
const CORE=['fedfunds','usdkrw','gold','kospi'];
const NUM='①②③④⑤⑥⑦⑧';
const IVN={D:'일간',W:'주간',M:'월간'};
const WD='일월화수목금토';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('econ.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('econ.'+k,JSON.stringify(v))}catch(e){}}};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C={};const col=v=>C[v]||(C[v]=css(v));const resetColors=()=>{C={}};

let DATA=null,S={},MONTHS=[],DAYS=[];
let state={on:store.get('on',CORE),iv:store.get('iv','D'),rng:store.get('rng',12),mode:store.get('mode','cmp'),norm:store.get('norm','mm')};
let K=[],COL={},CACHE={};           // 현재 봉 단위의 키/값 열
let view={a:0,b:0};                // 보이는 구간(실수 인덱스)
let hover=-1,activeChart=null,charts=[],custom=false;

/* ---------- 데이터 준비 ---------- */
function decDaily(e){if(!e||!e.s)return e||{};const out={};let t=Date.parse(e.s+'T00:00:00Z');
  for(let i=0;i<e.t.length;i++){t+=e.t[i]*864e5;out[new Date(t).toISOString().slice(0,10)]=e.v[i]}return out}
const hasD=id=>S[id]&&S[id].daily&&Object.keys(S[id].daily).length>0;
function computeKeys(){const ms=new Set(),ds=new Set();
  Object.values(S).forEach(s=>{Object.keys(s.values).forEach(k=>ms.add(k));
    if(s.daily&&s.id!=='fedfunds')Object.keys(s.daily).forEach(k=>{const w=new Date(k+'T00:00:00Z').getUTCDay();if(w&&w<6)ds.add(k)})});
  DAYS=[...ds].sort();DAYS.forEach(k=>ms.add(k.slice(0,7)));MONTHS=[...ms].sort();CACHE={}}
function reindex(){const had=K.length>0,end=had&&view.b>=K.length-1.5,span=view.b-view.a,from=had?endDate(K[Math.max(0,Math.round(view.a))]):null;
  K=buildKeys(state.iv);COL={};Object.keys(META).forEach(id=>{if(S[id])COL[id]=buildCol(id,state.iv)});
  if(!had){applyRange(state.rng,false);return}

    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(mode==='pinch'&&P.size>=2){const [p,q]=[...P.values()];const d=Math.abs(p.x-q.x)||1,m=(p.x+q.x)/2;const {padL,plotW}=ch.geo;const r=cv.getBoundingClientRect();
      const span0=start.b-start.a,ns=span0*start.d/d;const anchor=start.a+(start.m-r.left-padL)/plotW*span0;const a=anchor-(m-r.left-padL)/plotW*ns;setView(a,a+ns);return}
    if(mode==='cross'){setHover(ch,e.clientX);return}
    const dx=e.clientX-start.x;
    if(mode==='wait'&&Math.abs(dx)>6){clearTimeout(timer);mode='pan';hover=-1}
    if(mode==='pan'){moved=moved||Math.abs(dx)>3;const span=start.b-start.a;const sh=-dx/ch.geo.plotW*span;setView(start.a+sh,start.b+sh);
      const now=performance.now();if(now>lastT){vel=-(e.clientX-lastX)/ch.geo.plotW*span/(now-lastT);lastX=e.clientX;lastT=now}
      if(e.pointerType==='mouse'&&!moved)setHover(ch,e.clientX)}});
  const end=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);clearTimeout(timer);cv.classList.remove('grab');
    if(P.size===1&&mode==='pinch'){const p=[...P.values()][0];start={x:p.x,y:p.y,a:view.a,b:view.b,t:performance.now()};mode='pan';return}
    if(P.size)return;
    if(mode==='wait'&&e.type==='pointerup'){setHover(ch,start.x)}            // 짧게 탭 → 값 보기
    else if(mode==='cross'&&e.pointerType!=='mouse'){/* 손을 떼도 마지막 값 유지 */}
    if(mode==='pan'&&Math.abs(vel)>0.002&&performance.now()-lastT<80){let v=vel*16;const step=()=>{v*=0.92;panBy(v);if(Math.abs(v)>0.02)inertia=requestAnimationFrame(step)};inertia=requestAnimationFrame(step)}
    mode=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!P.size){hover=-1;drawAll()}});
}

    if(Math.abs(i-view.a)<tol)drag={t:'a'};else if(Math.abs(i-view.b)<tol)drag={t:'b'};

function delta(id,a,b){if(a==null||b==null)return null;return META[id].kind==='rate'?{v:a-b,t:'%p'}:{v:(a/b-1)*100,t:'%'}}

function pctl(id,v){const all=Object.values(S[id].values);const below=all.filter(x=>x<v).length;return Math.max(0,Math.min(100,Math.round(below/(all.length||1)*100)))}
function isProv(m){const d=new Date(Date.now()+9*3600e3);return m===`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`}
function lastOf(id){const ks=Object.keys(S[id].values).sort();return ks[ks.length-1]}
function shiftM(m,k){let[y,mo]=m.split('-').map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return `${y}-${String(mo).padStart(2,'0')}`}

function dShift(k,mo){const d=new Date(k+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+mo);return d.toISOString().slice(0,10)}
function latest(id){
  if(hasD(id)){const ks=Object.keys(S[id].daily).sort();const k=ks[ks.length-1],v=S[id].daily[k];
    return{k,v,label:fmtK(k),d1:delta(id,v,S[id].daily[ks[ks.length-2]]),w1:delta(id,v,dAt(id,new Date(Date.parse(k)-7*864e5).toISOString().slice(0,10))),m1:delta(id,v,dAt(id,dShift(k,-1))),y1:delta(id,v,dAt(id,dShift(k,-12)))}}
  const m=lastOf(id),v=S[id].values[m];

  const dir=!y1?'':Math.abs(y1.v)<(y1.t==='%p'?0.1:2)?'1년 전과 비슷':y1.v>0?'1년 새 상승':'1년 새 하락';return `${pos}, ${dir}`}
function spark(id){const r=colD(id);const n=r.length;const a=Math.max(0,n-66);const pts=r.slice(a).filter(v=>v!=null);if(pts.length<2)return'';
  const lo=Math.min(...pts),hi=Math.max(...pts);const d=pts.map((v,i)=>`${(i/(pts.length-1)*100).toFixed(2)},${(30-(v-lo)/((hi-lo)||1)*26).toFixed(2)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true"><polyline points="${d}" fill="none" stroke="var(${META[id].c})" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}

function corr(a,b){const n=a.length;if(n<6)return null;const ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;let sa=0,sb=0,sab=0;
  for(let i=0;i<n;i++){const da=a[i]-ma,db=b[i]-mb;sa+=da*da;sb+=db*db;sab+=da*db}return sa&&sb?sab/Math.sqrt(sa*sb):null}

    A=chg(x,buildColM(x),m0,m1);B=chg(y,buildColM(y),m0,m1)}else{A=chg(x,COL[x],i0,i1);B=chg(y,COL[y],i0,i1)}
  const a=[],b=[];A.forEach((v,i)=>{if(v!=null&&B[i]!=null){a.push(v);b.push(B[i])}});return corr(a,b)}

const INV_M=[['f','외국인'],['i','기관 계'],['mf','투신'],['pf','연기금'],['fi','금융투자'],['pe','사모'],['ins','보험'],['bk','은행'],['ec','기타법인'],['p','개인']];
const INV_S=[['f','외국인'],['i','기관'],['p','개인·기타'],['fr','외국인 보유율']];
let FLOWS={cols:[],rows:{}},KVOL={};
let FL={src:store.get('fsrc','mkt'),inv:store.get('finv','f'),mode:store.get('fmode','day'),rng:store.get('frng',3),stock:null,stockData:null,liveT:null,chart:null};
function decFlows(f){const out={cols:f&&f.cols||[],rows:{}};if(!f)return out;let t=Date.parse(f.s+'T00:00:00Z');
  for(let i=0;i<f.t.length;i++){t+=f.t[i]*864e5;out.rows[new Date(t).toISOString().slice(0,10)]=f.v[i]}return out}
const eok=v=>{if(v==null||isNaN(v))return'–';const a=Math.abs(v),s=v>0?'+':v<0?'−':'';return a>=10000?`${s}${(a/10000).toFixed(a>=100000?0:1)}조`:`${s}${Math.round(a).toLocaleString('ko-KR')}억`};
const qty=v=>{if(v==null)return'–';const a=Math.abs(v),s=v>0?'+':v<0?'−':'';return a>=1e8?`${s}${(a/1e8).toFixed(1)}억주`:a>=1e4?`${s}${Math.round(a/1e4).toLocaleString('ko-KR')}만주`:`${s}${Math.round(a).toLocaleString('ko-KR')}주`};
const volTxt=v=>{if(v==null)return'–';return v>=1e8?`${(v/1e8).toFixed(2)}억주`:v>=1e4?`${Math.round(v/1e4).toLocaleString('ko-KR')}만주`:`${v}주`};
const todayK=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const isProvDay=k=>{const n=new Date(Date.now()+9*3600e3);return k===todayK()&&n.getUTCHours()<18};

/* 화면에 쓸 데이터 묶음: K(날짜) · price · vol · flows{투자자:[억원]} · raw(주식수) */
function flowSet(){
  if(FL.src==='mkt'){
    const K2=Object.keys(FLOWS.rows).sort();const ci={};FLOWS.cols.forEach((c,i)=>ci[c]=i);
    const kd=S.kospi&&S.kospi.daily||{};let lp=null;
    const price=K2.map(k=>{if(kd[k]!=null)lp=kd[k];return lp});
    const fl={};INV_M.forEach(([c])=>fl[c]=K2.map(k=>{const r=FLOWS.rows[k];return r?r[ci[c]]:null}));
    return{K:K2,price,vol:K2.map(k=>KVOL[k]==null?null:KVOL[k]*1000)/* Yahoo ^KS11 거래량은 천 주 단위 */,fl,inv:INV_M,name:'KOSPI',unit:'억원',priceFmt:v=>v==null?'–':v.toLocaleString('ko-KR',{maximumFractionDigits:2,minimumFractionDigits:2})}
  }
  const d=FL.stockData;if(!d||!d.d)return null;const ci={};d.cols.forEach((c,i)=>ci[c]=i);
  const col=c=>d.v.map(r=>ci[c]==null?null:r[ci[c]]);
  const close=col('close'),f=col('f'),i=col('i'),fr=col('fr'),p=ci.p!=null?col('p'):f.map((x,k)=>x==null||i[k]==null?null:-(x+i[k]));
  const toE=a=>a.map((x,k)=>x==null||close[k]==null?null:x*close[k]/1e8);
  return{K:d.d,price:close,vol:col('vol'),fl:{f:toE(f),i:toE(i),p:toE(p),fr},raw:{f,i,p},inv:INV_S,name:d.name||d.code,unit:'억원(추정)',
    priceFmt:v=>v==null?'–':Math.round(v).toLocaleString('ko-KR')+'원',estP:ci.p==null}
}

function FlowChart(host){
  host.innerHTML='';const wrap=document.createElement('div');wrap.className='cv-wrap';
  const cv=document.createElement('canvas');cv.className='main';const tip=document.createElement('div');tip.className='tip';
  wrap.append(cv,tip);host.appendChild(wrap);
  let D=null,v={a:0,b:0},hov=-1,anim=null,inert=null;const geo={padL:58,padR:12,plotW:100};
  const n=()=>D?D.K.length-1:0;
  const clamp=(a,b)=>{const N=n(),ms=Math.min(N,5);let s=Math.max(ms,Math.min(N,b-a));if(a<0)a=0;if(a+s>N)a=N-s;return{a,b:a+s}};
  const vis=()=>[Math.max(0,Math.floor(v.a)),Math.min(n(),Math.ceil(v.b))];
  const api={};
  api.set=(data,keep)=>{const end=D&&v.b>=n()-1.5,span=v.b-v.a,from=D&&D.K[Math.round(v.a)];D=data;
    if(!D||!D.K.length){draw();return}
    if(keep&&from){if(end){v=clamp(n()-span,n())}else{const a=D.K.findIndex(k=>k>=from);v=clamp(a<0?0:a,(a<0?0:a)+span)}}else api.range(FL.rng,false);draw()};
  api.range=(m,an=true)=>{if(!D)return;const N=n();let a=0;if(m){const d=new Date(D.K[N]+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-m);const f=d.toISOString().slice(0,10);a=Math.max(0,D.K.findIndex(k=>k>f))}
    if(an)animTo(a,N);else v=clamp(a,N)};
  api.view=()=>vis();
  function setV(a,b){v=clamp(a,b);draw();FL.custom=true;syncFlowCtl();flowSchedule()}
  function animTo(a,b,ms=260){cancelAnimationFrame(anim);const t=clamp(a,b),s={...v},t0=performance.now();
    const st=now=>{const p=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-p,3);v={a:s.a+(t.a-s.a)*e,b:s.b+(t.b-s.b)*e};draw();if(p<1)anim=requestAnimationFrame(st);else flowSchedule()};anim=requestAnimationFrame(st)}
  const zoomAt=(f,fr)=>{const s=v.b-v.a,c=v.a+s*fr,ns=s*f;setV(c-ns*fr,c-ns*fr+ns)};
  const panBy=b=>setV(v.a+b,v.b+b);
  function draw(){
    const W=wrap.clientWidth,H=window.innerWidth<560?380:430,dpr=window.devicePixelRatio||1;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px'}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
    if(!D||!D.K.length){g.fillStyle=col('--text-3');g.font='13px sans-serif';g.textAlign='center';g.fillText('데이터를 불러오는 중입니다',W/2,H/2);return}
    const padL=geo.padL,padR=geo.padR,plotW=W-padL-padR;geo.plotW=plotW;
    const top=16,bot=H-22,tot=bot-top,h1=tot*.44,h2=tot*.34,gap=14,p1=[top,top+h1],p2=[p1[1]+gap,p1[1]+gap+h2],p3=[p2[1]+gap,bot];
    const [i0,i1]=vis();const X=i=>padL+(i-v.a)/(v.b-v.a)*plotW;const bw=plotW/(v.b-v.a+1);
    g.font='11px -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    const ext=(arr)=>{let lo=Infinity,hi=-Infinity;for(let i=i0;i<=i1;i++){const x=arr[i];if(x==null)continue;if(x<lo)lo=x;if(x>hi)hi=x}return[lo,hi]};
    const yAxis=(pane,lo,hi,fmt,n0=3,zero=false)=>{if(!isFinite(lo)){lo=0;hi=1}if(lo===hi){lo-=1;hi+=1}if(zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}const pd=(hi-lo)*.08;lo-=pd;hi+=pd;
      const Y=x=>pane[0]+(pane[1]-pane[0])*(1-(x-lo)/(hi-lo));g.strokeStyle=col('--grid');g.lineWidth=1;g.fillStyle=col('--text-3');g.textAlign='right';g.textBaseline='middle';
      niceTicks(lo,hi,n0).forEach(t=>{const y=Math.round(Y(t))+.5;if(y<pane[0]-1||y>pane[1]+1)return;g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();g.fillText(fmt(t),padL-6,y)});return Y};
    // x grid
    const xt=xTicks(i0,i1,plotW,D.K,false);g.textAlign='center';g.textBaseline='top';
    xt.forEach(t=>{const x=Math.round(X(t.i))+.5;if(x<padL||x>W-padR)return;g.strokeStyle=col('--grid');g.beginPath();g.moveTo(x,top);g.lineTo(x,bot);g.stroke();g.fillStyle=t.strong?col('--text-2'):col('--text-3');g.fillText(t.l,x,bot+6)});
    g.save();g.beginPath();g.rect(padL,0,plotW,H);g.clip();
    // 1) 가격
    const [plo,phi]=ext(D.price);const Y1=yAxis(p1,plo,phi,x=>x>=1e4?Math.round(x/1e3).toLocaleString('ko-KR')+'k':x>=1000?Math.round(x).toLocaleString('ko-KR'):x.toFixed(0),3);
    line(g,D.price,i0,i1,X,Y1,col('--text'),1.8);
    // 2) 수급
    const key=FL.inv,arr=D.fl[key]||[];const isLine=key==='fr';let Y2,cum=null;
    if(isLine){const [a,b]=ext(arr);Y2=yAxis(p2,a,b,x=>x.toFixed(1)+'%',3);line(g,arr,i0,i1,X,Y2,col('--s1'),1.8)}
    else if(FL.mode==='cum'){cum=new Array(arr.length).fill(null);let s=0;for(let i=i0;i<=i1;i++){if(arr[i]!=null)s+=arr[i];cum[i]=s}
      const [a,b]=ext(cum);Y2=yAxis(p2,a,b,x=>eok(x).replace('억',''),3,true);
      const y0=Y2(0);g.strokeStyle=col('--text-3');g.beginPath();g.moveTo(padL,Math.round(y0)+.5);g.lineTo(W-padR,Math.round(y0)+.5);g.stroke();
      const last=cum[i1]||0;line(g,cum,i0,i1,X,Y2,last>=0?col('--up'):col('--down'),2)}
    else{const [a,b]=ext(arr);Y2=yAxis(p2,a,b,x=>eok(x).replace('억',''),3,true);bars(g,arr,i0,i1,X,Y2,bw,true)}
    // 3) 거래량
    const [vlo,vhi]=ext(D.vol);const Y3=yAxis(p3,0,vhi,x=>'',2);bars(g,D.vol,i0,i1,X,Y3,bw,false);
    g.restore();
    // pane labels
    g.textAlign='left';g.textBaseline='top';g.fillStyle=col('--text-2');g.font='600 11.5px -apple-system,"Noto Sans KR",sans-serif';
    const lastI=(a)=>{let i=i1;while(i>=i0&&a[i]==null)i--;return i};
    const li=lastI(D.price);g.fillText(`${D.name} ${li>=0?D.priceFmt(D.price[li]):''}`,padL+4,p1[0]-14);
    const invName=(D.inv.find(x=>x[0]===key)||[0,''])[1];
    g.fillText(isLine?`${invName}(%)`:`${invName} ${FL.mode==='cum'?'누적 순매수(보이는 구간)':'일별 순매수'} · ${D.unit}`,padL+4,p2[0]-13);
    g.fillText('거래량',padL+4,p3[0]-13);g.font='11px -apple-system,"Noto Sans KR",sans-serif';
    // crosshair
    if(hov>=i0&&hov<=i1){const x=X(hov);g.strokeStyle=col('--text-3');g.setLineDash([3,3]);g.beginPath();g.moveTo(Math.round(x)+.5,top);g.lineTo(Math.round(x)+.5,bot);g.stroke();g.setLineDash([]);
      const dot=(y,c)=>{g.fillStyle=col('--surface');g.beginPath();g.arc(x,y,5,0,7);g.fill();g.fillStyle=c;g.beginPath();g.arc(x,y,3.5,0,7);g.fill()};
      if(D.price[hov]!=null)dot(Y1(D.price[hov]),col('--text'));
      const fv=cum?cum[hov]:arr[hov];if(fv!=null&&Y2)dot(Y2(fv),isLine?col('--s1'):fv>=0?col('--up'):col('--down'));
      const k=D.K[hov],pp=hov>0?D.price[hov-1]:null,pr=D.price[hov];
      const ch=pr!=null&&pp?((pr/pp-1)*100):null;
      let rows=`<div class="r"><span>${D.name}</span><b>${D.priceFmt(pr)} ${ch==null?'':`<span class="${ch>0?'up':ch<0?'down':''}" style="font-size:11px">${ch>0?'▲':ch<0?'▼':'■'}${Math.abs(ch).toFixed(2)}%</span>`}</b></div>`;
      if(isLine)rows+=`<div class="r"><span>${invName}</span><b>${arr[hov]==null?'–':arr[hov].toFixed(2)+'%'}</b></div>`;
      else{rows+=`<div class="r"><span>${invName} 순매수</span><b class="${arr[hov]>0?'up':arr[hov]<0?'down':''}">${eok(arr[hov])}${D.raw&&D.raw[key]?` <span style="font-weight:400;color:var(--text-3)">(${qty(D.raw[key][hov])})</span>`:''}</b></div>`;
        if(cum)rows+=`<div class="r"><span>구간 누적</span><b class="${cum[hov]>0?'up':cum[hov]<0?'down':''}">${eok(cum[hov])}</b></div>`}
      rows+=`<div class="r"><span>거래량</span><b>${volTxt(D.vol[hov])}</b></div>`;
      tip.innerHTML=`<div class="d">${fmtK(k)} (${WD[new Date(k+'T00:00:00Z').getUTCDay()]})${isProvDay(k)?' · 잠정':''}</div>`+rows;tip.style.display='block';
      const tw=tip.offsetWidth;let left=x+14;if(left+tw>W)left=x-tw-14;tip.style.left=Math.max(0,left)+'px';tip.style.top='6px'}
    else tip.style.display='none';
  }
  function line(g,a,i0,i1,X,Y,c,w){g.strokeStyle=c;g.lineWidth=w;g.lineJoin='round';g.beginPath();let pen=false,bx=null,mn=0,mx=0,ls=0;
    const fl=()=>{if(bx==null)return;if(mn!==mx){g.lineTo(bx,mn);g.lineTo(bx,mx)}g.lineTo(bx,ls)};
    for(let i=Math.max(0,i0-1);i<=Math.min(n(),i1+1);i++){const x0=a[i];if(x0==null){fl();bx=null;pen=false;continue}const x=X(i),y=Y(x0),px=Math.round(x);
      if(!pen){g.moveTo(x,y);pen=true;bx=px;mn=mx=ls=y;continue}if(px===bx){mn=Math.min(mn,y);mx=Math.max(mx,y);ls=y}else{fl();bx=px;mn=mx=ls=y;g.lineTo(x,y)}}fl();g.stroke()}
  function bars(g,a,i0,i1,X,Y,bw,signed){const y0=Y(0),w=Math.max(1,bw*.72);
    if(bw>=1.5){for(let i=i0;i<=i1;i++){const x0=a[i];if(x0==null)continue;const y=Y(x0);g.fillStyle=signed?(x0>=0?col('--up'):col('--down')):col('--text-3');if(!signed)g.globalAlpha=.45;
      g.fillRect(X(i)-w/2,Math.min(y,y0),w,Math.max(1,Math.abs(y0-y)));g.globalAlpha=1}return}
    const px={};for(let i=i0;i<=i1;i++){const x0=a[i];if(x0==null)continue;const p=Math.round(X(i));const o=px[p]||(px[p]={hi:0,lo:0});if(x0>o.hi)o.hi=x0;if(x0<o.lo)o.lo=x0}
    for(const p in px){const o=px[p];if(signed){if(o.hi>0){g.fillStyle=col('--up');const y=Y(o.hi);g.fillRect(+p,y,1,y0-y)}if(o.lo<0){g.fillStyle=col('--down');const y=Y(o.lo);g.fillRect(+p,y0,1,y-y0)}}
      else{g.fillStyle=col('--text-3');g.globalAlpha=.45;const y=Y(o.hi);g.fillRect(+p,y,1,y0-y);g.globalAlpha=1}}}
  // gestures
  const P=new Map();let mode=null,st=null,timer=null,vel=0,lx=0,lt=0;
  const idx=cx=>{const r=cv.getBoundingClientRect();return v.a+(cx-r.left-geo.padL)/geo.plotW*(v.b-v.a)};
  const frac=cx=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(1,(cx-r.left-geo.padL)/geo.plotW))};
  const sh=cx=>{const [i0,i1]=vis();hov=Math.max(i0,Math.min(i1,Math.round(idx(cx))));draw()};
  cv.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&!e.ctrlKey){panBy(e.deltaX/geo.plotW*(v.b-v.a));return}
    zoomAt(Math.exp(e.deltaY*(e.ctrlKey?0.01:0.0018)),frac(e.clientX));sh(e.clientX)},{passive:false});
  cv.addEventListener('dblclick',()=>{FL.custom=false;api.range(FL.rng);syncFlowCtl()});
  cv.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);cancelAnimationFrame(inert);cv.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX});
    if(P.size===1){st={x:e.clientX,a:v.a,b:v.b};lx=e.clientX;lt=performance.now();vel=0;
      if(e.pointerType==='mouse'){mode='pan';cv.classList.add('grab')}else{mode='wait';clearTimeout(timer);timer=setTimeout(()=>{if(mode==='wait'){mode='cross';sh(st.x)}},280)}}
    else if(P.size===2){clearTimeout(timer);const [p,q]=[...P.values()];mode='pinch';hov=-1;st={d:Math.abs(p.x-q.x)||1,m:(p.x+q.x)/2,a:v.a,b:v.b}}});
  cv.addEventListener('pointermove',e=>{if(!P.has(e.pointerId)){if(e.pointerType==='mouse')sh(e.clientX);return}P.set(e.pointerId,{x:e.clientX});
    if(mode==='pinch'&&P.size>=2){const [p,q]=[...P.values()];const d=Math.abs(p.x-q.x)||1,m=(p.x+q.x)/2,r=cv.getBoundingClientRect();const s0=st.b-st.a,ns=s0*st.d/d;
      const an=st.a+(st.m-r.left-geo.padL)/geo.plotW*s0;const a=an-(m-r.left-geo.padL)/geo.plotW*ns;setV(a,a+ns);return}
    if(mode==='cross'){sh(e.clientX);return}const dx=e.clientX-st.x;
    if(mode==='wait'&&Math.abs(dx)>6){clearTimeout(timer);mode='pan';hov=-1}
    if(mode==='pan'){const s=st.b-st.a,d=-dx/geo.plotW*s;setV(st.a+d,st.b+d);const now=performance.now();if(now>lt){vel=-(e.clientX-lx)/geo.plotW*s/(now-lt);lx=e.clientX;lt=now}if(e.pointerType==='mouse'&&Math.abs(dx)<3)sh(e.clientX)}});
  const end=e=>{if(!P.has(e.pointerId))return;P.delete(e.pointerId);clearTimeout(timer);cv.classList.remove('grab');
    if(P.size===1&&mode==='pinch'){const p=[...P.values()][0];st={x:p.x,a:v.a,b:v.b};mode='pan';return}if(P.size)return;
    if(mode==='wait'&&e.type==='pointerup')sh(st.x);
    if(mode==='pan'&&Math.abs(vel)>0.002&&performance.now()-lt<80){let q=vel*16;const step=()=>{q*=0.92;panBy(q);if(Math.abs(q)>0.02)inert=requestAnimationFrame(step)};inert=requestAnimationFrame(step)}mode=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!P.size){hov=-1;draw()}});
  new ResizeObserver(()=>draw()).observe(wrap);
  api.draw=draw;return api;
}
let ftm=null;function flowSchedule(){clearTimeout(ftm);ftm=setTimeout(renderFlowTable,120)}
function syncFlowCtl(){
  document.querySelectorAll('#fsrc button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===FL.src));
  document.querySelectorAll('#frange button').forEach(b=>b.setAttribute('aria-pressed',!FL.custom&&+b.dataset.r===FL.rng));
  document.querySelectorAll('#fmode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===FL.mode));
  $('#fmode').style.display=FL.inv==='fr'?'none':'';
  $('#stkbar').hidden=FL.src!=='stk';
}
function renderInvChips(D){const list=D?D.inv:(FL.src==='mkt'?INV_M:INV_S);if(!list.some(x=>x[0]===FL.inv))FL.inv='f';
  $('#finv').innerHTML=list.map(([c,nm])=>`<button class="chip" data-c="${c}" aria-pressed="${c===FL.inv}" style="--c:var(--accent)"><span class="nm">${nm}</span></button>`).join('');
  $('#finv').querySelectorAll('button').forEach(b=>b.onclick=()=>{FL.inv=b.dataset.c;store.set('finv',FL.inv);renderFlows(true)})}
function renderFlows(keep){
  syncFlowCtl();
  if(FL.src==='stk'&&!CFG.worker){$('#fchart').innerHTML='<div class="empty">종목 수급은 실시간 서버(Cloudflare Worker)를 연결하면 쓸 수 있습니다.<br>README의 「실시간 서버 연결」 순서를 참고하세요.</div>';FL.chart=null;$('#ftable').innerHTML='';$('#fhead').textContent='';renderInvChips(null);return}
  const D=flowSet();renderInvChips(D);
  if(!FL.chart||!document.querySelector('#fchart canvas'))FL.chart=FlowChart($('#fchart'));
  FL.chart.set(D,keep);
  if(FL.src==='mkt'){const last=D&&D.K[D.K.length-1];$('#fhead').innerHTML=`KOSPI 투자자별 순매수 · 최근 ${fmtK(last)}${last&&isProvDay(last)?' <b>잠정</b>':''}${FL.liveT?` · 실시간 ${FL.liveT.slice(11,16)}`:''}`}
  else{const d=FL.stockData;$('#fhead').innerHTML=d?`<b>${d.name||d.code}</b> ${d.code} · ${d.market||''}${d.quote?` · 현재 ${Math.round(d.quote.price).toLocaleString('ko-KR')}원 ${dtxt({v:(d.quote.price/d.quote.prev-1)*100,t:'%'})}`:''} · ${d.t.slice(11,16)} 기준`:'종목을 검색해 고르세요'}
  renderFlowTable();
}
function streak(a,end){let i=end;while(i>=0&&a[i]==null)i--;if(i<0)return null;const s=Math.sign(a[i]);if(!s)return null;let n=0;while(i>=0&&a[i]!=null&&Math.sign(a[i])===s){n++;i--}return{n,s}}
function renderFlowTable(){
  const D=flowSet();const box=$('#ftable');if(!D||!D.K.length||!FL.chart){box.innerHTML='';$('#fstreak').innerHTML='';return}
  const N=D.K.length-1,[i0,i1]=FL.chart.view();const sum=(a,from,to)=>{let s=0,c=0;for(let i=Math.max(0,from);i<=to;i++)if(a[i]!=null){s+=a[i];c++}return c?s:null};
  const cell=v=>`<td class="${v>0?'up':v<0?'down':''}">${eok(v)}</td>`;
  const rows=D.inv.filter(([c])=>c!=='fr').map(([c,nm])=>{const a=D.fl[c];const s=streak(a,N);
    return `<tr data-c="${c}" style="cursor:pointer${c===FL.inv?';background:var(--surface-2)':''}"><td><b>${nm}</b></td>${cell(a[N])}${cell(sum(a,N-4,N))}${cell(sum(a,N-19,N))}${cell(sum(a,N-59,N))}${cell(sum(a,i0,i1))}<td>${s?`<span class="${s.s>0?'up':'down'}">${s.n}일 연속 ${s.s>0?'순매수':'순매도'}</span>`:'–'}</td></tr>`}).join('');
  box.innerHTML=`<table><tr><th>투자자</th><th>${fmtK(D.K[N]).slice(5)}${isProvDay(D.K[N])?' 잠정':''}</th><th>5일</th><th>20일</th><th>60일</th><th>보이는 구간</th><th>연속</th></tr>${rows}</table>
   <div class="chart-note" style="margin-top:6px">단위 ${D.unit} · 순매수 = 매수 − 매도 · 표의 줄을 누르면 위 차트가 그 투자자로 바뀝니다${FL.src==='stk'?' · 종목은 순매수 주식수 × 그날 종가로 금액을 추정'+(D.estP?' · 개인·기타는 외국인·기관의 반대편으로 추정':''):''}</div>`;
  box.querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>{FL.inv=tr.dataset.c;store.set('finv',FL.inv);renderFlows(true)});
  // 한 줄 요약
  if(FL.inv!=='fr'){const a=D.fl[FL.inv],s=streak(a,N),nm=(D.inv.find(x=>x[0]===FL.inv)||[0,''])[1];const s20=sum(a,N-19,N),s60=sum(a,N-59,N);
    const px=D.price,c20=px[N]!=null&&px[Math.max(0,N-20)]?(px[N]/px[Math.max(0,N-20)]-1)*100:null;
    $('#fstreak').innerHTML=`<span><b>${nm}</b> ${s?`<span class="${s.s>0?'up':'down'}">${s.n}일 연속 ${s.s>0?'순매수':'순매도'}</span>`:''}</span><span>20일 누적 <b class="${s20>0?'up':s20<0?'down':''}">${eok(s20)}</b></span><span>60일 누적 <b class="${s60>0?'up':s60<0?'down':''}">${eok(s60)}</b></span>${c20==null?'':`<span>같은 20일 ${D.name} ${dtxt({v:c20,t:'%'})}</span>`}`}
  else{const a=D.fl.fr;const last=a[N],prev=a[Math.max(0,N-20)];$('#fstreak').innerHTML=`<span>외국인 보유율 <b>${last==null?'–':last.toFixed(2)+'%'}</b></span><span>20일 전 대비 ${last!=null&&prev!=null?dtxt({v:last-prev,t:'%p'}):'–'}</span>`}
}
/* 종목 검색 */
let srchT=null;
function recentStocks(){return store.get('stocks',[{code:'005930',name:'삼성전자'},{code:'000660',name:'SK하이닉스'}])}
function renderRecent(){$('#srecent').innerHTML=recentStocks().map(s=>`<button class="pre${FL.stock&&FL.stock.code===s.code?' main':''}" data-code="${s.code}" data-name="${s.name}">${s.name}</button>`).join('');
  $('#srecent').querySelectorAll('button').forEach(b=>b.onclick=()=>loadStock(b.dataset.code,b.dataset.name))}
async function loadStock(code,name,silent){
  FL.stock={code,name};store.set('stock',FL.stock);
  const rec=recentStocks().filter(s=>s.code!==code);rec.unshift({code,name});store.set('stocks',rec.slice(0,8));renderRecent();
  if(!silent){$('#fhead').textContent=`${name} 불러오는 중…`}
  try{const d=await wget('/stock?code='+code);const same=FL.stockData&&FL.stockData.code===code;FL.stockData=d;if(!same)FL.custom=false;renderFlows(same)}
  catch(e){if(!silent){$('#fhead').textContent=`${name} 데이터를 받지 못했습니다 (${e.message})`}}
}
function buildFlowUI(){
  document.querySelectorAll('#fsrc button').forEach(b=>b.onclick=()=>{FL.src=b.dataset.s;store.set('fsrc',FL.src);FL.custom=false;FL.chart=null;
    if(FL.src==='stk'&&CFG.worker&&!FL.stockData){const s=store.get('stock',recentStocks()[0]);loadStock(s.code,s.name)}renderFlows(false)});
  document.querySelectorAll('#frange button').forEach(b=>b.onclick=()=>{FL.rng=+b.dataset.r;store.set('frng',FL.rng);FL.custom=false;FL.chart&&FL.chart.range(FL.rng);syncFlowCtl();flowSchedule()});
  document.querySelectorAll('#fmode button').forEach(b=>b.onclick=()=>{FL.mode=b.dataset.m;store.set('fmode',FL.mode);renderFlows(true)});
  const inp=$('#sq'),res=$('#sres');
  inp.addEventListener('input',()=>{clearTimeout(srchT);const q=inp.value.trim();if(!q){res.hidden=true;return}
    srchT=setTimeout(async()=>{try{const d=await wget('/search?q='+encodeURIComponent(q));
      res.innerHTML=d.items.length?d.items.map(x=>`<button data-code="${x.code}" data-name="${x.name}"><b>${x.name}</b><span>${x.code} · ${x.market}</span></button>`).join(''):'<div class="empty" style="padding:12px">검색 결과가 없습니다</div>';res.hidden=false;
      res.querySelectorAll('button').forEach(b=>b.onclick=()=>{res.hidden=true;inp.value='';inp.blur();loadStock(b.dataset.code,b.dataset.name)})}catch(e){res.innerHTML='<div class="empty" style="padding:12px">검색 서버에 연결하지 못했습니다</div>';res.hidden=false}},250)});
  document.addEventListener('click',e=>{if(!e.target.closest('#stkbar'))res.hidden=true});
  renderRecent();
}

/* ---------- 데이터 받기 ---------- */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
async function fetchData(manual){
  try{const r=await fetch('data.json',{cache:'no-cache'})/* 바뀐 게 없으면 서버가 '그대로'만 답해 데이터 절약 */;if(!r.ok)throw 0;const d=await r.json();
    const old=DATA&&DATA.updated;if(old!==d.updated||manual)load(d);store.set('cache',d);if(manual)toast(old===d.updated?'이미 최신 데이터입니다':'새 데이터를 불러왔습니다')}
  catch(e){if(manual)toast('오프라인 · 저장된 데이터를 표시합니다')}
}
const th=store.get('theme',null);if(th)document.documentElement.dataset.theme=th;
buildChips();attachNav();buildFlowUI();
let seed=null;try{seed=JSON.parse(document.getElementById('seed').textContent)}catch(e){}
const cached=store.get('cache',null);
const pick=[cached,seed].filter(Boolean).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''))[0];
if(pick)load(pick);
fetchData(false);
setInterval(()=>{if(document.visibilityState==='visible')fetchData(false)},10*60e3);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){fetchData(false);pollLive()}});
(async()=>{try{const r=await fetch('config.json?t='+Date.now(),{cache:'no-store'});if(r.ok){const c=await r.json();if(c&&c.worker)CFG.worker=String(c.worker).trim()}}catch(e){}
  if(CFG.worker){pollLive();setInterval(pollLive,60e3);if(FL.src==='stk'){const st=store.get('stock',recentStocks()[0]);loadStock(st.code,st.name)}}
  renderFlows(true)})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{resetColors();render()});
let rw=window.innerWidth;window.addEventListener('resize',()=>{if((rw<560)!==(window.innerWidth<560)){rw=window.innerWidth;render()}});
})();

</script>
